<h1>{{ portalName }}</h1>


<button
[disabled]="!isPortalActive"
(click)="onEnrollClick()">

Enroll Now

</button>


<p>
{{ message }}
</p>


<input
[(ngModel)]="searchTerm"
placeholder="Search course">


<p>
Searching for: {{ searchTerm }}
</p>


<!--
[property] is one-way binding.
Data flow:
Component → HTML


[(ngModel)] is two-way binding.
Data flow:
Component ↔ HTML
-->
